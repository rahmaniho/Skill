name: OSM probe

# آزمون دودی موتور دادهٔ واقعی از یک شبکهٔ بیرونی (نزدیک به محیط تولید).
# اجرای دستی: Actions → OSM probe → Run workflow
on:
  # اجرای دستی: Actions → OSM probe → Run workflow (شهر/صنف دلخواه)
  workflow_dispatch:
    inputs:
      city:
        description: "شهر برای آزمون (خالی = تهران/رامسر/اوز)"
        required: false
        default: ""
      niche:
        description: "صنف (مثلاً رستوران، دندانپزشکی)"
        required: false
        default: ""
      street:
        description: "خیابان برای سنجش پوشش کامل (مثلاً ولیعصر) — خالی = سنجش شهر"
      pipeline:
        description: "مسیر کامل محدودهٔ خیابان در پایپ‌لاین (1 = بله؛ با city/street)"
        required: false
        default: ""
      endpoints:
        description: "سنجش آینه‌های Overpass (1 = بله)"
        required: false
        default: ""
      nominatim:
        description: "شمارش تکه‌های یک خیابان در Nominatim (مثلاً ولیعصر، تهران)"
        required: false
        default: ""
      coverage:
        description: "سنجش پوشش جغرافیایی آینه‌ها (1 = بله)"
        required: false
        default: ""
      raw:
        description: "کوئری‌های Overpass برای عیب‌یابی (با ||| جدا شوند)"
        required: false
        default: ""
      parts:
        description: "محله‌ها برای تکه‌کردن خیابان (مثل ونک,تجریش,پارکوی)"
        required: false
        default: ""
  # اجرای خودکار وقتی موتور داده تغییر می‌کند
  push:
    paths:
      - ".github/workflows/osm-probe.yml"
      - "scripts/osm_probe.py"
      - "leadgen/providers/osm.py"
      - "leadgen/osm_tags.py"
      - "leadgen/engine.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Probe Overpass + Nominatim
        env:
          LEADGEN_DATA_DIR: /tmp/leadgen-probe
          OSM_MODE: hybrid
          CITY: ${{ github.event.inputs.city }}
          NICHE: ${{ github.event.inputs.niche }}
          STREET: ${{ github.event.inputs.street }}
          PIPELINE: ${{ github.event.inputs.pipeline }}
          ENDPOINTS: ${{ github.event.inputs.endpoints }}
          NOMINATIM: ${{ github.event.inputs.nominatim }}
          COVERAGE: ${{ github.event.inputs.coverage }}
          PARTS: ${{ github.event.inputs.parts }}
          RAW: ${{ github.event.inputs.raw }}
        run: |
          set -o pipefail
          set +e
          if [ -n "$RAW" ]; then
            python3 scripts/osm_probe.py --raw "$RAW" 2>&1 | tee probe.log
          elif [ -n "$PARTS" ]; then
            python3 scripts/osm_probe.py --city "${CITY:-تهران}" --street "${STREET:-ولیعصر}" --parts "$PARTS" --json 2>&1 | tee probe.log
          elif [ "$COVERAGE" = "1" ]; then
            python3 scripts/osm_probe.py --coverage --json 2>&1 | tee probe.log
          elif [ -n "$NOMINATIM" ]; then
            python3 scripts/osm_probe.py --nominatim "$NOMINATIM" --json 2>&1 | tee probe.log
          elif [ "$ENDPOINTS" = "1" ]; then
            python3 scripts/osm_probe.py --endpoints --json 2>&1 | tee probe.log
          elif [ "$PIPELINE" = "1" ]; then
            python3 scripts/osm_probe.py --city "${CITY:-تهران}" --street "${STREET:-ولیعصر}" --pipeline --json 2>&1 | tee probe.log
          elif [ -n "$STREET" ]; then
            python3 scripts/osm_probe.py --city "${CITY:-تهران}" --street "$STREET" --json 2>&1 | tee probe.log
          elif [ -n "$CITY" ]; then
            python3 scripts/osm_probe.py --city "$CITY" --niche "$NICHE" --json 2>&1 | tee probe.log
          else
            python3 scripts/osm_probe.py --json 2>&1 | tee probe.log
          fi
          echo "PROBE_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0    # نتیجه در گام بعدی گزارش می‌شود تا حتی با لاگِ خراب هم دیده شود
      - name: Report (annotations + summary)
        if: always()
        run: |
          # لاگ آرتیفکت گاهی از GitHub قابل دانلود نیست؛ اینجا همان متن را به‌صورت
          # annotation منتشر می‌کنیم تا نتیجهٔ واقعی همیشه خواندنی باشد.
          summary=$(grep -m1 '^SUMMARY ' probe.log 2>/dev/null || true)
          if [ -n "$summary" ]; then
            echo "::error title=street-summary::${summary#SUMMARY }"
          fi
          if [ ! -f probe.log ]; then
            echo "::error title=probe::probe.log ساخته نشد (اسکریپت پیش از اجرا شکست)"
          else
            n=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              if printf '%s' "$line" | grep -q '✗'; then
                echo "::error title=probe-fail::${line}"
              else
                echo "::notice title=probe::${line}"
              fi
              n=$((n+1))
              [ "$n" -ge 30 ] && break
            done < probe.log
            {
              echo "### آزمون OSM"
              echo
              echo '```'
              tail -n 40 probe.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fail when no real result
        if: always()
        run: |
          echo "probe exit: ${PROBE_EXIT:-?}"
          [ "${PROBE_EXIT:-1}" = "0" ]
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: osm-probe
          path: probe.log
