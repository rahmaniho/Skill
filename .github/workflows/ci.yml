name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      ENGINE_MODE: demo
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile check
        run: python -m compileall -q leadgen scripts

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Doctor (demo engine)
        run: python -m leadgen.cli doctor

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Frontend syntax check
        run: |
          node --check web/app.js
          node --check site/app.js
          node --check smart/app.js
          node --check smart/campaign.js

      - name: Static site smoke test (fake DOM)
        run: node scripts/smoke_site.js

      - name: Simple UI smoke test (fake DOM, demo mode)
        run: node scripts/smoke_smart.js

      - name: Pages copy of the simple UI is in sync
        run: python scripts/build_pages_app.py --check
