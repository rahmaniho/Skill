name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      ENGINE_MODE: demo
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile check
        run: python -m compileall -q leadgen scripts

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Doctor (demo engine)
        run: python -m leadgen.cli doctor

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Frontend syntax check
        run: |
          node --check web/app.js
          node --check site/app.js
          node --check smart/app.js
          node --check smart/campaign.js
          node --check mini/app.js

      - name: Static site smoke test (fake DOM)
        run: node scripts/smoke_site.js

      - name: Simple UI smoke test (fake DOM, demo mode)
        run: node scripts/smoke_smart.js

      - name: Compact UI smoke test (fake DOM, demo mode)
        run: node scripts/smoke_mini.js

      - name: Compact UI smoke test against a live server
        run: |
          python -m leadgen.server --host 127.0.0.1 --port 8123 > /tmp/leadgen-server.log 2>&1 &
          SERVER_PID=$!
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8123/api/health > /dev/null && break
            sleep 0.5
          done
          STATUS=0
          SMOKE_LIVE=http://127.0.0.1:8123 node scripts/smoke_mini.js || STATUS=$?
          kill "$SERVER_PID" 2>/dev/null || true
          if [ "$STATUS" -ne 0 ]; then tail -40 /tmp/leadgen-server.log; fi
          exit "$STATUS"

      - name: Pages copies of the web UIs are in sync
        run: python scripts/build_pages_app.py --check
